<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Handeul Kim · 포트폴리오</title>
<style>
  :root {
    --bg-1: #14141f;
    --bg-2: #1b1b2b;
    --accent: #d4a24e;
    --accent-soft: rgba(212, 162, 78, 0.14);
    --text: #ececf1;
    --text-dim: #86869a;
    --card-bg: rgba(255, 255, 255, 0.035);
    --card-border: rgba(255, 255, 255, 0.08);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html { scroll-behavior: smooth; }

  body {
    min-height: 100vh;
    font-family: -apple-system, "Apple SD Gothic Neo", "Segoe UI", "Malgun Gothic", sans-serif;
    background: var(--bg-1);
    background-image: radial-gradient(circle at 50% 0%, var(--bg-2), var(--bg-1) 60%);
    color: var(--text);
    line-height: 1.5;
  }

  a { color: inherit; }

  .wrap {
    max-width: 860px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* 상단 네비 */
  nav {
    position: sticky;
    top: 0;
    z-index: 10;
    background: rgba(20, 20, 31, 0.85);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--card-border);
  }

  nav .wrap {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 56px;
    max-width: 860px;
  }

  nav .brand {
    font-weight: 700;
    font-size: 0.92rem;
    letter-spacing: 0.3px;
  }

  nav ul {
    list-style: none;
    display: flex;
    gap: 4px;
  }

  nav a {
    display: inline-block;
    padding: 6px 12px;
    border-radius: 7px;
    font-size: 0.82rem;
    color: var(--text-dim);
    text-decoration: none;
    transition: background 0.15s ease, color 0.15s ease;
  }

  nav a:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.05);
  }

  /* 히어로 */
  header.hero {
    padding: 72px 0 56px;
    text-align: center;
  }

  header.hero .eyebrow {
    color: var(--accent);
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: 1px;
    margin-bottom: 14px;
  }

  header.hero h1 {
    font-size: clamp(1.7rem, 4vw, 2.3rem);
    font-weight: 700;
    margin-bottom: 12px;
  }

  header.hero p.tagline {
    color: var(--text-dim);
    font-size: 1rem;
    max-width: 520px;
    margin: 0 auto 26px;
    line-height: 1.65;
  }

  .contact-row {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--accent-soft);
    color: var(--accent);
    border: 1px solid rgba(212, 162, 78, 0.35);
    padding: 8px 18px;
    font-size: 0.82rem;
    border-radius: 8px;
    cursor: pointer;
    font-weight: 600;
    text-decoration: none;
    transition: background 0.15s ease, border-color 0.15s ease;
  }

  .btn:hover {
    background: rgba(212, 162, 78, 0.24);
    border-color: rgba(212, 162, 78, 0.55);
  }

  .btn.ghost {
    background: transparent;
    color: var(--text-dim);
    border-color: var(--card-border);
  }

  .btn.ghost:hover {
    color: var(--text);
    border-color: var(--text-dim);
  }

  /* 섹션 공통 */
  section {
    padding: 48px 0;
    border-top: 1px solid var(--card-border);
  }

  section .section-head {
    margin-bottom: 24px;
  }

  section .section-head .label {
    color: var(--accent);
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  section .section-head h2 {
    font-size: 1.25rem;
    font-weight: 700;
  }

  /* 핵심 역량 */
  .skills {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }

  .skill-tag {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    color: var(--text-dim);
    font-size: 0.8rem;
    padding: 6px 13px;
    border-radius: 999px;
  }

  /* 경력 타임라인 */
  .timeline {
    display: flex;
    flex-direction: column;
    gap: 18px;
  }

  .timeline-item {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    padding: 20px 22px;
  }

  .timeline-item .role-row {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 10px;
  }

  .timeline-item .role {
    font-weight: 700;
    font-size: 0.98rem;
  }

  .timeline-item .period {
    color: var(--text-dim);
    font-size: 0.78rem;
  }

  .timeline-item ul {
    list-style: none;
    color: var(--text-dim);
    font-size: 0.86rem;
    line-height: 1.7;
  }

  .timeline-item ul li::before {
    content: "· ";
    color: var(--accent);
  }

  /* 프로젝트 아코디언 */
  .projects {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .project {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 10px;
    overflow: hidden;
  }

  .project-toggle {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: transparent;
    border: none;
    color: var(--text);
    text-align: left;
    padding: 18px 20px;
    cursor: pointer;
    font-family: inherit;
  }

  .project-toggle .title-block .name {
    font-weight: 700;
    font-size: 0.92rem;
    margin-bottom: 4px;
  }

  .project-toggle .title-block .meta {
    color: var(--text-dim);
    font-size: 0.76rem;
  }

  .project-toggle .chevron {
    color: var(--accent);
    font-size: 0.85rem;
    transition: transform 0.2s ease;
    flex-shrink: 0;
  }

  .project.open .chevron { transform: rotate(180deg); }

  .project-body {
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
  }

  .project.open .project-body {
    max-height: 600px;
  }

  .project-body-inner {
    padding: 0 20px 22px;
    display: grid;
    grid-template-columns: 1fr;
    gap: 16px;
  }

  @media (min-width: 620px) {
    .project-body-inner {
      grid-template-columns: 1fr 1fr;
    }
  }

  .project-body-inner h4 {
    color: var(--accent);
    font-size: 0.74rem;
    font-weight: 700;
    letter-spacing: 0.5px;
    margin-bottom: 8px;
  }

  .project-body-inner ul {
    list-style: none;
    color: var(--text-dim);
    font-size: 0.84rem;
    line-height: 1.7;
  }

  .project-body-inner ul li::before {
    content: "· ";
    color: var(--accent);
  }

  /* 교육 및 자격 */
  .edu-grid {
    display: grid;
    grid-template-columns: 1fr;
    gap: 18px;
  }

  @media (min-width: 620px) {
    .edu-grid { grid-template-columns: 1fr 1fr; }
  }

  .edu-block h3 {
    font-size: 0.85rem;
    color: var(--text);
    margin-bottom: 10px;
  }

  .edu-block ul {
    list-style: none;
    color: var(--text-dim);
    font-size: 0.84rem;
    line-height: 1.8;
  }

  .edu-block ul li::before {
    content: "· ";
    color: var(--accent);
  }

  footer {
    padding: 32px 0 44px;
    text-align: center;
    color: var(--text-dim);
    font-size: 0.75rem;
  }
</style>
</head>

  <div class="wrap">

<script>
  const skills = [

    },

  });

  document.getElementById('eduGrid').innerHTML =
    Object.entries(education).map(([title, items]) => `
      <div class="edu-block">
        <h3>${title}</h3>
        <ul>${items.map(i => `<li>${i}</li>`).join('')}</ul>
      </div>
    `).join('');
</script>

</body>
</html>
